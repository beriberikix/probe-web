<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>probe-web debugger components</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 0; padding: 12px; color: #111; }
    h1 { font-size: 18px; margin: 0 0 6px; } h2 { font-size: 13px; margin: 0 0 4px; color: #444; }
    .grid { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(320px, 1.4fr) minmax(220px, 0.8fr); gap: 10px; }
    section { border: 1px solid #ddd; border-radius: 8px; padding: 8px; min-width: 0; overflow: auto; max-height: 60vh; }
    pre { background: #f5f5f5; padding: 8px; border-radius: 6px; font-size: 12px; white-space: pre-wrap; max-height: 25vh; overflow: auto; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>Debugger components</h1>
  <section><probe-core-controls id="controls"></probe-core-controls></section>
  <div class="grid" style="margin-top:10px">
    <section><h2>Call stack</h2><probe-callstack id="stack"></probe-callstack></section>
    <section><h2>Variables</h2><probe-variables id="vars"></probe-variables></section>
    <section><h2>Registers</h2><probe-registers id="regs"></probe-registers></section>
  </div>
  <div class="grid" style="margin-top:10px">
    <section><h2>Breakpoints</h2><probe-breakpoints id="bps"></probe-breakpoints></section>
    <section><h2>Disassembly</h2><probe-disassembly id="dis"></probe-disassembly></section>
    <section><h2>Peripherals</h2><probe-peripherals id="periph"></probe-peripherals></section>
  </div>
  <section style="margin-top:10px"><h2>Memory</h2><probe-memory-view id="mem"></probe-memory-view></section>
  <pre id="log"></pre>
  <script type="module" src="/src/debug.ts"></script>
</body>
</html>
