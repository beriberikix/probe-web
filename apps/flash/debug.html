<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>probe-web debugger components</title>
  <script>
    ;(() => {
      let p = 'auto'
      try { p = localStorage.getItem('vitepress-theme-appearance') || 'auto' } catch {}
      if (p === 'auto' ? matchMedia('(prefers-color-scheme: dark)').matches : p === 'dark')
        document.documentElement.classList.add('dark')
    })()
  </script>
  <style>
    /* Colours and type come from the shared shell (imported by debug.ts). */
    html { background: #fff; } html.dark { background: #1b1b1f; }
    html body { padding: 16px; background: var(--pw-c-bg-alt); }
    h1 { font-size: 18px; font-weight: 600; margin: 0 0 12px; }
    h2 {
      margin: -8px -10px 8px; padding: 0 10px; line-height: 30px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--pw-c-text-2); border-bottom: 1px solid var(--pw-c-divider);
    }
    .grid { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(320px, 1.4fr) minmax(220px, 0.8fr); gap: 12px; }
    section {
      border: 1px solid var(--pw-c-divider); border-radius: var(--pw-radius-lg); padding: 8px 10px;
      min-width: 0; overflow: auto; max-height: 60vh; background: var(--pw-c-bg);
    }
    pre {
      padding: 8px 12px; border-radius: var(--pw-radius-lg); font-size: 12px; white-space: pre-wrap; max-height: 25vh; overflow: auto;
      background: var(--pw-c-bg); border: 1px solid var(--pw-c-divider); color: var(--pw-c-text-2);
    }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>Debugger components</h1>
  <section><probe-core-controls id="controls"></probe-core-controls></section>
  <div class="grid" style="margin-top:12px">
    <section><h2>Call stack</h2><probe-callstack id="stack"></probe-callstack></section>
    <section><h2>Variables</h2><probe-variables id="vars"></probe-variables></section>
    <section><h2>Registers</h2><probe-registers id="regs"></probe-registers></section>
  </div>
  <div class="grid" style="margin-top:12px">
    <section><h2>Breakpoints</h2><probe-breakpoints id="bps"></probe-breakpoints></section>
    <section><h2>Disassembly</h2><probe-disassembly id="dis"></probe-disassembly></section>
    <section><h2>Peripherals</h2><probe-peripherals id="periph"></probe-peripherals></section>
  </div>
  <section style="margin-top:12px"><h2>Memory</h2><probe-memory-view id="mem"></probe-memory-view></section>
  <pre id="log"></pre>
  <script type="module" src="/src/debug.ts"></script>
</body>
</html>
