<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flasher · probe-web</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    // The docs' light/dark setting (VitePress's own check), applied before first paint.
    ;(() => {
      let p = 'auto'
      try { p = localStorage.getItem('vitepress-theme-appearance') || 'auto' } catch {}
      if (p === 'auto' ? matchMedia('(prefers-color-scheme: dark)').matches : p === 'dark')
        document.documentElement.classList.add('dark')
    })()
  </script>
  <style>
    /* Reserved before the stylesheet arrives, so nothing shifts or flashes. */
    html { background: #fff; } html.dark { background: #1b1b1f; }
    body { margin: 0; }
    .app-bar { height: 44px; box-sizing: border-box; }
    .ws-only { display: none !important; }
    .workspace:has(input[name=transport][value=websocket]:checked) .ws-only { display: grid !important; }
  </style>
</head>
<body>
  <header class="app-bar" data-app="flash"></header>

  <div class="workspace">
    <aside class="sidebar" id="sidebar" aria-label="Setup">
      <details class="view" id="view-connection" open>
        <summary><span class="step">1</span>Connection<span class="badge"></span></summary>
        <div class="view-body">
          <div class="segmented" role="radiogroup" aria-label="transport">
            <label title="probe-rs runs in this tab and talks to the probe over WebUSB"><input type="radio" name="transport" value="webusb" checked> WebUSB <small>probe-rs in this tab</small></label>
            <label title="Connect to a native probe-rs serve"><input type="radio" name="transport" value="websocket"> WebSocket <small>probe-rs serve</small></label>
          </div>
          <div class="fields ws-only">
            <label class="field"><span>url</span><input type="text" id="ws-url" value="ws://127.0.0.1:3000" size="24"></label>
            <label class="field"><span>token</span><input type="text" id="ws-token" value="" size="10"></label>
          </div>
          <div class="actions">
            <button id="connect" class="primary">Connect</button>
            <span id="conn-status" class="status-text"></span>
          </div>
        </div>
      </details>

      <details class="view" id="view-probe" open>
        <summary><span class="step">2</span>Probe<span class="badge"></span></summary>
        <div class="view-body">
          <probe-device-picker id="picker"></probe-device-picker>
        </div>
      </details>

      <details class="view" id="view-target" open>
        <summary><span class="step">3</span>Target<span class="badge"></span></summary>
        <div class="view-body">
          <div class="fields">
            <label class="field"><span>chip</span><input type="text" id="chip" size="14" placeholder="auto-detect"></label>
            <label class="field"><span>protocol</span><select id="protocol"><option value="">auto</option><option>Swd</option><option>Jtag</option></select></label>
          </div>
          <div class="actions">
            <button id="attach" class="primary">Attach</button>
            <span id="attach-status" class="status-text"></span>
          </div>
          <probe-target-picker id="targets"></probe-target-picker>
        </div>
      </details>
    </aside>
    <div class="sash" id="sidebar-sash" role="separator" aria-orientation="vertical" aria-label="Resize sidebar"></div>

    <main class="main">
      <div class="scroll">
        <div class="content">
          <section class="card" aria-labelledby="flash-title">
            <div class="card-header">
              <h2 id="flash-title"><span class="step-inline">4</span> Flash</h2>
              <span class="spacer"></span>
              <label class="check muted">Demo firmware
                <select id="demo" title="Images built and shipped with this site">
                  <option value="">loading…</option>
                </select>
              </label>
              <span id="manifest-name" class="muted">loading manifest…</span>
            </div>
            <div class="card-body">
              <probe-flash-panel id="flash"></probe-flash-panel>
            </div>
          </section>
        </div>
      </div>

      <div class="sash horizontal" id="panel-sash" role="separator" aria-orientation="horizontal" aria-label="Resize output panel"></div>
      <section class="output-panel" id="panel" aria-label="Output">
        <div role="tablist" id="panel-tabs" aria-label="Output">
          <button role="tab" id="tab-rtt" aria-controls="panel-rtt">RTT</button>
          <button role="tab" id="tab-semi" aria-controls="panel-semi">Semihosting</button>
          <button role="tab" id="tab-serial" aria-controls="panel-serial">Serial</button>
          <button role="tab" id="tab-log" aria-controls="panel-log">Log</button>
        </div>
        <div role="tabpanel" id="panel-rtt" aria-labelledby="tab-rtt"><probe-rtt-terminal id="rtt"></probe-rtt-terminal></div>
        <div role="tabpanel" id="panel-semi" aria-labelledby="tab-semi" hidden><probe-semihosting-console id="semi"></probe-semihosting-console></div>
        <div role="tabpanel" id="panel-serial" aria-labelledby="tab-serial" hidden><probe-serial-monitor id="serial"></probe-serial-monitor></div>
        <div role="tabpanel" id="panel-log" aria-labelledby="tab-log" hidden><pre class="log" id="log"></pre></div>
      </section>
    </main>
  </div>

  <footer class="status-bar">
    <span class="item dot" id="sb-connection">not connected</span>
    <span class="item" id="sb-probe"></span>
    <span class="item" id="sb-target"></span>
    <span class="spacer"></span>
    <span class="item" id="sb-flash"></span>
  </footer>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
