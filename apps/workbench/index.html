<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workbench · probe-web</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    // The docs' light/dark setting (VitePress's own check), applied before first paint.
    ;(() => {
      let p = 'auto'
      try { p = localStorage.getItem('vitepress-theme-appearance') || 'auto' } catch {}
      if (p === 'auto' ? matchMedia('(prefers-color-scheme: dark)').matches : p === 'dark')
        document.documentElement.classList.add('dark')
    })()
  </script>
  <style>
    /* Reserved before the stylesheet arrives, so nothing shifts or flashes. */
    html { background: #fff; } html.dark { background: #1b1b1f; }
    body { margin: 0; }
    .app-bar { height: 44px; box-sizing: border-box; }
  </style>
</head>
<body>
  <header class="app-bar" data-app="workbench">
    <div class="app-actions" role="group" aria-label="Session">
      <label class="check" title="Halt at the program's entry point after launching"><input type="checkbox" id="stop-on-entry"> stop on entry</label>
      <button id="launch" class="primary" data-icon="play" title="Flash the ELF and start debugging">Launch</button>
      <button id="attach" data-icon="link" title="Debug the firmware already running, without flashing">Attach</button>
      <button id="stop" class="danger" data-icon="stop" disabled title="End the debug session">Stop</button>
      <button id="dump-core" data-icon="download" disabled title="Save a coredump of the halted core, readable by native probe-rs">Dump core</button>
    </div>
  </header>

  <div class="toolbar" id="toolbar">
    <div class="group" role="group" aria-label="Target">
      <select id="transport" title="Where probe-rs runs: on a server reached over WebSocket, or in this page over WebUSB">
        <option value="websocket">WebSocket</option>
        <option value="webusb">WebUSB</option>
      </select>
      <input id="url" value="ws://127.0.0.1:3000" size="18" title="probe-rs serve URL">
      <input id="token" placeholder="token" size="7" title="probe-rs serve token">
      <input id="probe" placeholder="probe (substring)" size="12" title="Which probe: part of its name or serial number">
      <button id="pick-probe" hidden data-icon="plug" title="Let this page use a probe over WebUSB (the browser asks which one)">Select probe…</button>
      <input id="chip" placeholder="chip" size="10" title="Target chip">
      <select id="protocol" title="wire protocol"><option>Swd</option><option>Jtag</option></select>
    </div>
    <span class="sep"></span>
    <div class="group" role="group" aria-label="Files">
      <button id="pick-elf" data-icon="file" title="Pick the firmware ELF; it is watched and re-flashed when rebuilt">ELF…</button>
      <span id="elf-name" class="file-name"></span>
      <button id="pick-svd" data-icon="chip" title="Pick an SVD file for the Peripherals panel">SVD…</button>
      <label id="pick-config" class="button" title="Prefill chip, probe and protocol from an Embed.toml or launch.json you already have">Config…<input type="file" id="config-file" accept=".toml,.json" hidden></label>
      <span id="svd-name" class="file-name"></span>
      <button id="pick-src" data-icon="folder" title="Pick the project folder so sources can be shown">Sources…</button>
      <span id="src-name" class="file-name"></span>
      <button id="resume" hidden class="ghost"></button>
      <button id="forget" class="ghost" title="Forget the remembered ELF, SVD and source folder">Forget files</button>
    </div>
    <span class="spacer"></span>
    <button id="reset-layout" class="icon" data-icon="layout" title="Reset the panel layout" aria-label="Reset layout"></button>
  </div>

  <div id="dock" class="dockview-theme-light"></div>

  <footer class="status-bar">
    <span id="status" class="item dot">not connected</span>
    <span class="spacer"></span>
    <span class="item" id="sb-elf"></span>
    <span class="item" id="sb-chip"></span>
    <span class="item" id="sb-transport"></span>
  </footer>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
