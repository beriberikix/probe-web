[package]
name = "nrf9160-semihosting"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
panic-halt = "1"

[profile.release]
debug = true
opt-level = "s"
