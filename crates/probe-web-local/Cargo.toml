[package]
name = "probe-web-local"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
description = "probe-rs compiled to wasm, serving the probe-rs RPC protocol inside a Web Worker over WebUSB"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Adds a fake probe with a mocked core (probe_rs::integration::FakeProbe) so the
# local transport can be exercised in CI without hardware: list/attach/memory/core ops.
fake = []

[dependencies]
anyhow = "1"
# The async fork with the nusb 0.2.7 WebUSB port. Replaced by crates.io probe-rs once the async port lands upstream.
probe-rs = { git = "https://github.com/beriberikix/probe-rs", branch = "webusb/nusb-0.2.7", default-features = false, features = ["builtin-targets"] }
probe-rs-rpc = { git = "https://github.com/beriberikix/probe-rs", branch = "wasm-rpc-client" }
# The fork's async DWARF layer (stack traces, variables, breakpoints, stepping) for debugging in the worker.
probe-rs-debug = { git = "https://github.com/beriberikix/probe-rs", branch = "webusb/nusb-0.2.7" }
# Same version as the fork's probe-rs-debug (source paths in breakpoint requests).
# embedded-test hands its test list over semihosting as JSON.
serde_json = "1"
typed-path = "0.11"
# Same version as probe-rs serve (CMSIS-SVD peripherals in the Peripherals scope).
svd-parser = { version = "=0.14.10", features = ["expand"] }
postcard-rpc = { version = "0.12", features = ["use-std"] }
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["sync", "macros"] }
tokio-util = "0.7"
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["DedicatedWorkerGlobalScope", "MessageEvent", "console"] }
console_error_panic_hook = { workspace = true }
futures = { workspace = true }
web-time = { workspace = true }
tracing = { workspace = true }
tracing-wasm = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }

[dev-dependencies]
# For the check-coredump example: shows the file's real structure when probe-rs refuses
# it, which is the difference between "it broke" and knowing which field is wrong.
rmpv = "1"
# To report the serde error by name; probe-rs's wrapper hides it.
rmp-serde = "1"
