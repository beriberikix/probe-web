[package]
name = "probe-web-local"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "probe-rs compiled to wasm, serving the probe-rs RPC protocol inside a Web Worker over WebUSB"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Adds a fake probe with a mocked core (probe_rs::integration::FakeProbe) so the
# local transport can be exercised in CI without hardware: list/attach/memory/core ops.
fake = []

[dependencies]
# The async fork with the nusb 0.2.7 WebUSB port. Replaced by crates.io probe-rs once the async port lands upstream.
probe-rs = { path = "../../../probe-rs/probe-rs", default-features = false, features = ["builtin-targets"] }
probe-rs-rpc = { path = "../../../prs-wasm-rpc/probe-rs-rpc" }
postcard-rpc = { version = "0.12", features = ["use-std"] }
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["sync", "macros"] }
tokio-util = "0.7"
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["DedicatedWorkerGlobalScope", "MessageEvent", "console"] }
console_error_panic_hook = { workspace = true }
futures = { workspace = true }
web-time = { workspace = true }
tracing = { workspace = true }
tracing-wasm = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
