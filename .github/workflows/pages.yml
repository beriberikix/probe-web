name: Deploy the docs and apps to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a running one, it may already be publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup installs the channel and the wasm32 target named in rust-toolchain.toml.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.128
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - run: ./scripts/build-wasm.sh

      # The demo images the site offers, so a visitor can flash a board without having a
      # firmware file of their own. Cortex-M only: the ESP32-S3 image needs the Xtensa
      # toolchain, which is a much larger install.
      - run: ./scripts/build-firmware.sh

      # The docs and all apps under one origin, because WebUSB grants are per origin. A project
      # site is served from /<repo>/, so that is the base every URL is built against.
      - name: Build the site
        run: ./scripts/build-site.sh "/${{ github.event.repository.name }}/"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
