name: Release

# Pushing a v* tag is the whole release: this builds the wasm the packages ship, runs the
# checks against it, publishes the six packages to npm, and opens the GitHub release from
# the tag's CHANGELOG section.
#
# There is no npm token. npm is configured to trust this repository and *this file by name*
# over OIDC (https://docs.npmjs.com/trusted-publishers), which also attests each package to
# the commit and run that built it. Renaming or moving this file breaks publishing until
# every package's trusted publisher is updated to match.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release
  id-token: write # mint the OIDC token npm authenticates with

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup installs the channel and the wasm32 target named in rust-toolchain.toml.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2

      # Must match the wasm-bindgen crate version in Cargo.lock, or the glue and the
      # module disagree.
      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.128

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Node 22 bundles npm 10; trusted publishing needs 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1

      - run: npm ci

      # Without id-token: write there is no OIDC token to authenticate with, and since
      # there is no token fallback the publish would fail — after the wasm build and the
      # whole suite. This costs nothing and fails in seconds.
      - name: An OIDC token is available
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::No OIDC token: this job needs 'permissions: id-token: write'"
            exit 1
          fi

      # A tag that disagrees with the manifests would publish a version nobody can trace
      # back to it, so fail before anything is built.
      - name: The tag matches the packages' version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for pkg in client ui dap devices artifacts serial; do
            found=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "$found" != "$version" ]; then
              echo "::error::@probe-web/$pkg is $found, but the tag says $version"
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The packages ship this: it is gitignored build output, not something the tag carries.
      - name: Build the wasm crates
        run: ./scripts/build-wasm.sh

      - name: Generated wire types are up to date
        run: git diff --exit-code packages/client/src/wire.ts

      - run: npx tsc -b packages/client packages/ui packages/dap packages/devices packages/artifacts packages/serial apps/flash apps/workbench examples/monaco-ide examples/minimal-flash examples/react-flash
      - run: npm test

      - name: Browser tests (fake probe, no hardware)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      # Dependencies before their dependents, so nobody can install an @probe-web/ui whose
      # client is not on the registry yet. A version that is already published is skipped,
      # which is what makes re-running this workflow after a partial failure safe.
      #
      # Published from inside each package rather than with `npm publish -w` from the root:
      # npm documents trusted publishing for a plain publish and says nothing about
      # workspaces, so this keeps to the shape the registry expects. Provenance needs no
      # flag on this path — npm generates it from the OIDC token.
      - name: Publish to npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          for pkg in devices artifacts serial client dap ui; do
            if npm view "@probe-web/$pkg@$VERSION" version >/dev/null 2>&1; then
              echo "@probe-web/$pkg@$VERSION is already published, skipping"
            else
              (cd "packages/$pkg" && npm publish)
            fi
          done

      # The section the CHANGELOG already carries for this version is the release body.
      - name: Release notes from the CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section"
            exit 1
          fi
          cat release-notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
