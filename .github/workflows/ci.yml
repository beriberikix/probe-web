name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a superseded run of the same branch: a full build compiles probe-rs from source.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup installs the channel and the wasm32 target named in rust-toolchain.toml.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2

      # Must match the wasm-bindgen crate version in Cargo.lock, or the glue and the
      # module disagree.
      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.128

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build the wasm crates
        run: ./scripts/build-wasm.sh

      - name: Generated wire types are up to date
        run: git diff --exit-code packages/client/src/wire.ts

      - name: Generated xterm stylesheet is up to date
        run: |
          node scripts/gen-xterm-css.mjs
          git diff --exit-code packages/ui/src/xterm-css.generated.ts

      # @probe-web/ui ships compiled JS, so everything downstream -- the app builds, tsc,
      # the browser tests -- resolves it through dist/ exactly as an npm consumer does.
      - name: Build @probe-web/ui
        run: npm run build -w @probe-web/ui

      - run: npx tsc -b packages/client packages/ui packages/dap packages/devices packages/artifacts packages/serial apps/flash apps/workbench examples/monaco-ide examples/minimal-flash examples/react-flash
      - run: npm test

      # Before the browser tests, not after: the service-worker spec drives a production
      # build, and it fails rather than skipping when site/ is missing on CI.
      # The site includes the docs: TypeDoc fails on an undocumented export or a broken
      # {@link}, and VitePress on a dead link.
      - name: Build the static site and docs
        run: ./scripts/build-site.sh

      - name: Browser tests (fake probe, no hardware)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      # A symlinked workspace resolves source a real install never sees, so this is the only
      # step that exercises what npm consumers actually get. It runs against the *latest*
      # Vite on purpose: this repository builds on Vite 6, and the failure it guards against
      # was a newer Vite silently dropping decorator support (#7) -- the build succeeded and
      # only the browser noticed.
      - name: The packages work in a plain consumer
        run: node scripts/check-consumer.mjs

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn

  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup installs the channel and the wasm32 target named in rust-toolchain.toml.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The lint that keeps host-only APIs (thread::sleep, std Instant) out of wasm builds.
      - run: cargo clippy --target wasm32-unknown-unknown -p probe-web-core -p probe-web-local -p probe-web-targets -- -D warnings
      # probe-web-targets is pure (bytes in, YAML out), so it has real unit tests and
      # they run on the host. The vendor-.FLM corpus test skips unless PROBE_WEB_FLM_DIR
      # is set; the formatter tests, which guard re-loadability, always run.
      - run: cargo test -p probe-web-targets
      # Checks the generator's serde renames against probe-rs-rpc's real output.
      - run: cargo test -p probe-web-wire-gen
