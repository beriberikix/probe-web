[workspace]
resolver = "2"
members = ["crates/*", "spikes/*"]
# Cross-compiled fixture with its own workspace and target.
exclude = ["spikes/defmt-fixture"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/beriberikix/probe-web"

[workspace.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
tsify = { version = "0.5", default-features = false, features = ["js"] }
futures = "0.3"
web-time = "1"
tracing = "0.1"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# Upstream cmsis-pack (pyocd/cmsis-pack-manager) declares reqwest and tokio
# unconditionally, so the crate does not compile for wasm32 at all -- even though only
# its `update` module needs them. The fork gates that module behind a default-on
# `update` feature, leaving the .pdsc parser buildable with `default-features = false`.
# The change is upstreamable; until it lands, the patch redirects the crates.io name.
# For local work against a checkout, see .cargo/config.toml.
[patch.crates-io]
cmsis-pack = { git = "https://github.com/beriberikix/cmsis-pack-manager", branch = "wasm/optional-network" }
