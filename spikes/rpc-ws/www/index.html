<!doctype html>
<meta charset="utf-8">
<title>spike A: probe-rs RPC over WebSocket from wasm</title>
<style>body{font:14px ui-monospace,Menlo,monospace;margin:16px} pre{background:#f5f5f5;padding:12px;white-space:pre-wrap}</style>
<h3>probe-rs-rpc-client (wasm32) → ws://127.0.0.1:3000/worker</h3>
<label>url <input id="url" value="ws://127.0.0.1:3000/worker" size="40"></label>
<label>token <input id="token" value="spike" size="12"></label>
<button id="go">connect + list</button>
<pre id="out">ready</pre>
<script type="module">
import init, { run } from './pkg/spike_rpc_ws.js';
const out = document.getElementById('out');
const log = (m) => { out.textContent += m + "\n"; console.log("[E2E] " + m); };
async function go() {
  out.textContent = '';
  try {
    await init();
    log("wasm instantiated");
    const t0 = performance.now();
    log(await run(document.getElementById('url').value, document.getElementById('token').value));
    log("elapsed " + Math.round(performance.now() - t0) + "ms");
  } catch (e) { log("EXCEPTION: " + (e && e.stack ? e.stack : e)); }
}
document.getElementById('go').onclick = go;
if (new URLSearchParams(location.search).has('auto')) go();
</script>
