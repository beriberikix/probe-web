[package]
name = "spike-rpc-ws"
version = "0.0.0"
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
probe-rs-rpc = { path = "../../../prs-wasm-rpc/probe-rs-rpc" }
probe-rs-rpc-client = { path = "../../../prs-wasm-rpc/probe-rs-rpc-client" }
postcard-rpc = { version = "0.12", features = ["use-std"] }
tokio = { version = "1", features = ["sync", "macros"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["WebSocket", "MessageEvent", "BinaryType", "Event", "CloseEvent", "ErrorEvent", "console"] }
console_error_panic_hook = { workspace = true }
sha2 = "0.11"
base64 = "0.22"
futures = { workspace = true }
