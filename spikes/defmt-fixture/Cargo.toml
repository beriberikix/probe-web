[package]
name = "defmt-fixture"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone (not a probe-web workspace member): cross-compiled for QEMU.
[workspace]

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
defmt = "1"
defmt-semihosting = "0.3"
panic-probe = { version = "1", features = ["print-defmt"] }

[profile.release]
debug = true
opt-level = "s"
