[package]
name = "spike-webusb-worker"
version = "0.0.0"
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The async fork with the nusb 0.2.7 WebUSB port (this session's branch).
probe-rs = { path = "../../../probe-rs/probe-rs", default-features = false, features = ["builtin-targets"] }
# master's wire schema + client, with the wasm patch.
probe-rs-rpc = { path = "../../../prs-wasm-rpc/probe-rs-rpc" }
probe-rs-rpc-client = { path = "../../../prs-wasm-rpc/probe-rs-rpc-client" }
postcard-rpc = { version = "0.12", features = ["use-std"] }
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["sync", "macros"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["DedicatedWorkerGlobalScope", "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "console"] }
console_error_panic_hook = { workspace = true }
futures = { workspace = true }
web-time = { workspace = true }
