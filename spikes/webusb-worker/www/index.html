<!doctype html>
<meta charset="utf-8">
<title>spike B: probe-rs in a Web Worker over WebUSB</title>
<style>body{font:14px ui-monospace,Menlo,monospace;margin:16px} pre{background:#f5f5f5;padding:12px;white-space:pre-wrap} button,input{font:inherit;padding:6px 10px;margin:0 6px 8px 0}</style>
<h3>main thread: probe-rs-rpc-client (wasm) → postMessage → worker: probe-rs + nusb(WebUSB)</h3>
<label>chip <input id="chip" value="MCXA153" size="14"></label>
<label>protocol <input id="proto" value="swd" size="6"></label>
<label>read addr <input id="addr" value="0x0" size="12"></label><br>
<button id="auth">1. Authorize device</button>
<button id="go">2. Run (list, chips, attach, read)</button>
<pre id="out">ready</pre>
<script type="module">
import init, { main_run } from './pkg/spike_webusb_worker.js';
const out = document.getElementById('out');
const log = (m) => { out.textContent += m + "\n"; console.log("[E2E] " + m); };
document.getElementById('auth').onclick = async () => {
  try {
    const dev = await navigator.usb.requestDevice({ filters: [{ vendorId: 0x303A }, { vendorId: 0x1366 }, { vendorId: 0x1FC9 }, { vendorId: 0x0D28 }] });
    log(`authorized: ${dev.productName} ${dev.vendorId.toString(16)}:${dev.productId.toString(16)}`);
  } catch (e) { log("authorize failed: " + e); }
};
async function go() {
  out.textContent = '';
  try {
    await init();
    log("main wasm instantiated");
    const t0 = performance.now();
    log(await main_run(document.getElementById('chip').value, document.getElementById('proto').value, document.getElementById('addr').value));
    log("elapsed " + Math.round(performance.now() - t0) + "ms");
  } catch (e) { log("EXCEPTION: " + (e && e.stack ? e.stack : e)); }
}
document.getElementById('go').onclick = go;
if (new URLSearchParams(location.search).has('auto')) go();
</script>
