<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minimal flash · probe-web</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    // Follow the docs' light/dark setting (VitePress keeps it in localStorage).
    ;(() => {
      let p = 'auto'
      try { p = localStorage.getItem('vitepress-theme-appearance') || 'auto' } catch {}
      if (p === 'auto' ? matchMedia('(prefers-color-scheme: dark)').matches : p === 'dark')
        document.documentElement.classList.add('dark')
    })()
  </script>
  <style>
    /* Colours and type come from @probe-web/ui/theme.css, imported by main.ts. */
    html { background: #fff; } html.dark { background: #1b1b1f; }
    html body { font-size: 14px; max-width: 44rem; margin: 0 auto; padding: 2.5rem 1rem; }
    .back { font-size: 13px; }
    h1 { margin: 12px 0 8px; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; }
    p { color: var(--pw-c-text-2); line-height: 1.7; margin: 0 0 24px; }
    .card { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; padding: 16px; border: 1px solid var(--pw-c-divider); border-radius: var(--pw-radius-lg); background: var(--pw-c-bg-soft); }
    label { display: grid; gap: 4px; font-size: 12px; font-weight: 500; color: var(--pw-c-text-2); }
    select { min-width: 16rem; font-size: 14px; }
    button { min-height: 32px; padding: 0 16px; font-size: 14px; }
    pre { margin: 16px 0 0; padding: 12px 16px; min-height: 8rem; white-space: pre-wrap; font-size: 13px; border-radius: var(--pw-radius-lg); background: var(--pw-c-bg-alt); border: 1px solid var(--pw-c-divider); }
    pre:empty::before { content: 'Output appears here.'; color: var(--pw-c-text-3); }
  </style>
</head>
<body>
  <a class="back" href="../">← probe-web</a>
  <h1>Minimal flash</h1>
  <p>
    The whole SDK flow in one file: grant a probe, attach, flash with progress, reset and run.
    Needs Chrome or Edge and a supported board.
  </p>
  <div class="card">
    <label>Board
      <select id="board">
        <option value="mcxa153-debug-manifest.json">FRDM-MCXA153</option>
        <option value="nrf9160-debug-manifest.json">Thingy:91 (nRF9160)</option>
      </select>
    </label>
    <button id="go" class="primary">Select probe and flash</button>
  </div>
  <pre id="out"></pre>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
