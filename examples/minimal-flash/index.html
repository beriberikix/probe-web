<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>probe-web: minimal flash</title>
  <style>
    body { font: 14px system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
    label, button { font: inherit; margin-right: 0.5rem; }
    pre { background: #f4f4f5; padding: 0.75rem; min-height: 8rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Minimal flash</h1>
  <p>
    The whole SDK flow in one file: grant a probe, attach, flash with progress, reset and run.
    Needs Chrome or Edge and a supported board.
  </p>
  <label>Board
    <select id="board">
      <option value="mcxa153-debug-manifest.json">FRDM-MCXA153</option>
      <option value="nrf9160-debug-manifest.json">Thingy:91 (nRF9160)</option>
    </select>
  </label>
  <button id="go">Select probe and flash</button>
  <pre id="out"></pre>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
